  - id: DS011
    name: "Precipitation Data for Postfire Debris-Flows in southern California, 2021-2025"
    description: >
      This collection contains 12 gridded precipitation datasets and gauge (point) data over southern
      California during seven debris-flow triggering storms between 2021 and 2025. The precipitation
      estimates were gathered from already published, open-access data sources to support work
      investigating the utility of gridded precipitation data for postfire debris-flow applications. The
      project also includes a list of documented postfire debris flows during the storms investigated.
    pi: "Daniel Horton"
    institution: "Northwestern University"
    primary_contact: "Ann Sinclair - annsinclair2028@u.northwestern.edu"
    personnel:
