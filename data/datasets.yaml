  - id: DS016
    name: "Downscaled Reanalysis over Southeast and Southcentral Alaska, 2015-2025"
    description: >
      This dataset contains dynamically downscaled ERA5 reanalysis over Southeast and South Central
      Alaska. The simulations were generated using the Weather Research and Forecasting model, and have
      3-km hourly resolution. The downscaled atmospheric data are being produced to support land surface
      hazard research in Southeast Alaska, with a focus on generating estimates of extreme precipitation
      during historical landslide events.
