  - id: DS013
    name: "Soil water retention monitoring and soil classification after 2025 Palisades Fire"
    description: >
      Continuous matric suction and volumetric water content measurements and standard soil classification
      tests at the Mandeville, Los Leones, and Topanga Canyon to quantify spatiotemporal changes in soil
      type and hydrologic behavior, which will be used evaluate landslide susceptibility. Sensors are
      TEROS 21 and TEROS 11 (Meter Group, Pullman WA), installed at 10, 30, and 50 cm depths. Soil
      characterization experiments were performed with samples collected at 10 and 50 cm depths and
      include sieve analysis, hydrometer, Atterberg limits.
    pi: "Idil Akin"
    institution: "University of California, Los Angeles"
    observatories:
      - "SoCal"
    data_type:
      - "Geotechnical"
      - "Hydrological"
      - "Laboratory / Analytical"
      - "Sedimentological / Soil"
    field_site: "Santa Monica Mountains"
    spatial:
      type: bboxes
      boxes:
        - {north: 34.12113298700008, south: 34.0470404243752, east: -118.5049110189999, west: -118.595794150771}
    collection_start: "2/18/25"
    temporal_resolution: "1 hour"
    size_gb: 1.0
    data_level: "L2b: Finalized quality controlled data"
    collection_status: Active - ongoing collection
    data_location: "Lab computers and backup drives"
    date_added: "9/14/26 19:06"

