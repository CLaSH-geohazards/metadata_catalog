  - id: DS020
    name: "Hillslope hydrological monitoring data in Puerto Rico, October 2021 to September 2025"
    description: >
      Time-series data from 18 hillslope hydrologic monitoring stations installed in Puerto Rico following
      Hurricane María (2017). Their primary scientific focus is to investigate subsurface hydrologic
      response to rainfall and develop a quantitative link between rainfall, soil moisture, and
      landsliding. This datasets contains soil volumetric water content at four depth intervals of 25 cm,
      soil water potential, and pore-water pressure, all logged at 5-minute intervals.   For more
      information, please visit the official USGS data release: https://www.usgs.gov/data/hillslope-
      hydrological-monitoring-data-puerto-rico-october-2021-september-2025
