    field_site: "southern California"
    spatial:
      type: bboxes
      boxes:
        - {north: 38.0, south: 32.0, east: -114.0, west: -123.0}
    collection_start: "1/27/21"
    collection_end: "9/17/25"
    temporal_resolution: "1 hour"
    spatial_resolution: "variable"
    format: "netCDF"
    size_gb: 10.0
    data_level: "L4: Derived products"
